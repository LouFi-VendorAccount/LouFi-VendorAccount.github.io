<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>

  <!-- LouFi Stylesheet -->
  <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
</head>
<body>

  <header class="site-header">
    <div class="wrapper">
      <a class="site-title display-title" href="{{ "/" | relative_url }}">{{ site.title }}</a>
      
      <nav class="site-nav">
        {% for path in site.header_pages %}
          {% assign page_obj = site.pages | where: "path", path | first %}
          {% if page_obj %}
            <a href="{{ page_obj.url | relative_url }}">{{ page_obj.title }}</a>
          {% endif %}
        {% endfor %}
      </nav>
    </div>
  </header>

  <main class="page-content">
    <div class="wrapper">
      {{ content }}
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrapper">
      <p>&copy; {{ "now" | date: "%Y" }} {{ site.title }}</p>
    </div>
  </footer>

</body>
</html>
